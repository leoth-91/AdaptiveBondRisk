syntax = "proto3";

package adaptive_bond_risk.protocol;

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string server_version = 2;
}

message YieldCurvePoint {
  double maturity = 1;
  double zero_rate = 2;
}

message BondPosition {
  string id = 1;
  double face_value = 2;
  double coupon_rate = 3;
  double time_to_maturity = 4;
  uint32 coupon_frequency = 5;
  double time_to_next_coupon = 6;
  double quantity = 7;
}

message PortfolioValueRequest {
  repeated YieldCurvePoint yield_curve = 1;
  repeated BondPosition positions = 2;
}

message DiscountedCashFlow {
  double payment_time = 1;
  double amount = 2;
  double discount_factor = 3;
  double present_value = 4;
}

message BondValuation {
  string id = 1;
  double quantity = 2;
  double unit_value = 3;
  double position_value = 4;
  repeated DiscountedCashFlow cash_flows = 5;
}

message PortfolioValueResponse {
  double total_value = 1;
  repeated BondValuation positions = 2;
}

message SimulateLossesRequest {
  repeated YieldCurvePoint base_yield_curve = 1;
  repeated BondPosition positions = 2;
  repeated double mean = 3;
  repeated double covariance = 4;
  uint32 num_samples = 5;
  uint64 seed = 6;
}

message LossSample {
  repeated double shock = 1;
  double loss = 2;
}

message SimulateLossesResponse {
  repeated LossSample samples = 1;
}

message Request {
  uint64 request_id = 1;

  oneof payload {
    PingRequest ping = 2;
    PortfolioValueRequest portfolio_value = 3;
    SimulateLossesRequest simulate_losses = 4;
  }
}

message Response {
  uint64 request_id = 1;
  bool success = 2;
  string error = 3;

  oneof payload {
    PingResponse ping = 4;
    PortfolioValueResponse portfolio_value = 5;
    SimulateLossesResponse simulate_losses = 6;
  }
}
